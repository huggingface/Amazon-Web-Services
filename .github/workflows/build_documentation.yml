name: Build Documentation

on:
  push:
    branches:
      - main
      - doc-builder*

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@911ed7872ad44fe0e1e6f03c232fbf4ab42c5957  # main
    with:
      commit_sha: ${{ github.sha }}
      package: Amazon-Web-Services
      package_name: sagemaker
      path_to_docs: Amazon-Web-Services/source
      additional_args: --not_python_module
      pre_command: cd Amazon-Web-Services && make docs
    secrets:
      token: ${{ secrets.HUGGINGFACE_PUSH }}
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
